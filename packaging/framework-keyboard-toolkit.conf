# framework-keyboard-toolkit configuration (/etc/framework-keyboard-toolkit.conf)
#
# Easiest way to change it: ./fkt.sh configure   (asks and restarts)
# By hand: edit, then  sudo systemctl restart framework-keyboard-toolkit

# Keyboard, numpad and macropad share one backlight level: change it on one
# and the others follow. With "no" only the keyboard is managed and the
# numpad keeps the level set with its own key.
sync = yes

# The backlight level follows the ambient light sensor (table "bands" below).
# With "no" the level only changes when you press a backlight key.
ambient = yes

# Turn NumLock on at boot and at login, when a numpad is attached.
# Turning this on needs access to /dev/uinput, which only fkt.sh
# grants: use ./fkt.sh set numlock=yes rather than editing this line.
numlock = yes

# The numpad has no NumLock light. With "yes" a NumLock change is shown on the
# power-button LED: two short blinks = on, one long blink = off. This needs
# access to that LED, which only fkt.sh grants: use ./fkt.sh set indicator=yes.
indicator = no

# Backlight level (0-255) by ambient light, as "below-this-many-lux:level",
# ending with "*:level" for anything brighter. The keyboards and the numpad
# have four steps: 0 (off), 85, 170 and 255.
bands = 20:255 250:170 *:0
